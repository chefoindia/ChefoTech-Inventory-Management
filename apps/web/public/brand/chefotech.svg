<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ChefoTech">
  <title>ChefoTech</title>
  <defs>
    <linearGradient id="ct-net" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a96"/>
      <stop offset="0.32" stop-color="#2b7cc4"/>
      <stop offset="0.56" stop-color="#f4b223"/>
      <stop offset="0.82" stop-color="#e1332a"/>
      <stop offset="1" stop-color="#b3261e"/>
    </linearGradient>
  </defs>

  <!-- Network edges: hexagon, long diagonals and the links to the inner nodes. -->
  <g stroke="url(#ct-net)" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M100 20 L169 60 L169 140 L100 180 L31 140 L31 60 Z"/>
    <path d="M31 60 L169 140"/>
    <path d="M169 60 L31 140"/>
    <path d="M100 20 L100 180"/>
    <path d="M31 60 L100 96 L169 60"/>
    <path d="M31 140 L100 96"/>
    <path d="M100 96 L131 116 L169 140"/>
    <path d="M131 116 L100 180"/>
    <path d="M131 116 L169 60"/>
  </g>

  <!-- Nodes, coloured by their place in the mark. -->
  <g>
    <circle cx="100" cy="20" r="14" fill="#2b7cc4"/>
    <circle cx="169" cy="60" r="14" fill="#f4b223"/>
    <circle cx="169" cy="140" r="14" fill="#e1332a"/>
    <circle cx="100" cy="180" r="14" fill="#1b3f7c"/>
    <circle cx="31" cy="140" r="14" fill="#1b4a96"/>
    <circle cx="31" cy="60" r="14" fill="#1f5fae"/>
    <circle cx="100" cy="96" r="12" fill="#2b7cc4"/>
    <circle cx="131" cy="116" r="11" fill="#f4b223"/>
  </g>
</svg>
